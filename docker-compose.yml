services:
  agent-api:
    build: .
    ports:
      - '8000:8000'
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
      # Override: inside the container, localhost is the container itself
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - 'host.docker.internal:host-gateway'   # needed on Linux
    restart: unless-stopped