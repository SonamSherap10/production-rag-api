[project]
name = "production-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SonamSherap10", email = "sonamserpa3231@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.19",
    "langsmith>=0.14.16",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "slowapi>=0.1.10",
    "uvicorn>=0.54.0",
]

[project.scripts]
production-rag = "production_rag:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
